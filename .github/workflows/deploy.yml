# APP PIPELINE: Build the React app and deploy it to the EC2 server.
#
# Starts when code in react-app/ is pushed to any branch
# (or by hand from the "Actions" tab - e.g. after Terraform
# created a new server).
#
# How it works (no SSH, no hard-coded IP):
#   1. Build the React app
#   2. Upload the build to S3
#   3. Find the EC2 server by its Name tag, and wait until it is ready
#   4. Tell the server (through AWS SSM) to copy the files from S3 into nginx

name: App Pipeline (Deploy React App)

on:
  push:
    branches: ["**"] # "**" = every branch
    paths:
      - "react-app/**" # Only app code changes start this pipeline
  workflow_dispatch: # Lets you run it manually from the "Actions" tab

# Never run two deploys at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

# Needed so GitHub can log in to AWS with OIDC (no access keys)
permissions:
  id-token: write
  contents: read
  actions: read # Lets us check if the Infra Pipeline is still running

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: react-app # Must match project_name in terraform/variables.tf

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # 3. Install packages, run tests, build the app into react-app/build
      - name: Install, test and build
        working-directory: react-app
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build

      # If the Infra Pipeline is running on this branch (e.g. creating the server),
      # wait for it to finish before deploying.
      - name: Wait for Infra Pipeline to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            RUNNING=$(gh run list --repo "${{ github.repository }}" --workflow terraform.yml \
              --branch "${{ github.ref_name }}" --json status \
              --jq '[.[] | select(.status != "completed")] | length')

            if [ "$RUNNING" = "0" ]; then
              echo "Infra Pipeline is not running. Continuing."
              break
            fi

            echo "Infra Pipeline is still running. Waiting..."
            sleep 15
          done

      # 4. Log in to AWS using the role Terraform created
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Upload the build files to S3
      - name: Upload build to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="$PROJECT_NAME-deploy-$ACCOUNT_ID"
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV
          aws s3 sync react-app/build "s3://$BUCKET" --delete

      # 6. Find the running server by its Name tag
      - name: Find EC2 server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$PROJECT_NAME-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" = "None" ]; then
            echo "No running server found. Run the Terraform pipeline first."
            exit 1
          fi

          echo "Found server: $INSTANCE_ID"
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      # 7. A brand-new server needs a minute or two to boot.
      #    Wait until it is connected to AWS SSM (checks every 10s, up to 5 min).
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "Server is ready."
              exit 0
            fi

            echo "Waiting for server... ($i/30)"
            sleep 10
          done

          echo "Server was not ready after 5 minutes."
          exit 1

      # 8. Tell the server to copy the files from S3 into nginx's folder.
      #    "cloud-init status --wait" first waits for install_nginx.sh to finish.
      - name: Deploy on server
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy React app" \
            --parameters "commands=[\"cloud-init status --wait\",\"/snap/bin/aws s3 sync s3://$BUCKET /var/www/html --delete\"]" \
            --query "Command.CommandId" --output text)

          # Check every 10s (up to 10 min) until the command finishes
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                echo "Deployed successfully!"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed on the server: $STATUS"
                exit 1 ;;
            esac

            echo "Deploying... ($STATUS)"
            sleep 10
          done

          echo "Deploy did not finish after 10 minutes."
          exit 1
