# INFRA PIPELINE: Create/update the AWS infrastructure with Terraform.
#
#   Push to terraform/ (any branch) -> updates DEV automatically
#   Run by hand from the "Actions" tab -> you choose dev, qa or prod
#
# Each environment uses its own folder: terraform/environments/<env>

name: Infra Pipeline (Terraform)
run-name: Terraform -> ${{ inputs.environment || 'dev' }}

on:
  push:
    branches: ["**"] # "**" = every branch
    paths:
      - "terraform/**" # Only Terraform code changes start this pipeline
  workflow_dispatch: # Run by hand, and choose the environment
    inputs:
      environment:
        description: "Which environment?"
        type: choice
        options: [dev, qa, prod]
        default: dev

# Needed so GitHub can log in to AWS with OIDC (no access keys)
permissions:
  id-token: write
  contents: read

# Never run two Terraform pipelines on the same environment at the same time
concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  terraform:
    runs-on: ubuntu-latest

    # The chosen environment (on a push, "inputs" is empty, so it is "dev").
    # For prod you can require an approval in GitHub (Settings -> Environments).
    environment: ${{ inputs.environment || 'dev' }}

    # All "run" commands below happen inside the chosen environment's folder
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment || 'dev' }}

    steps:
      # 1. Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Terraform (same version as on your laptop)
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      # 3. Log in to AWS using the role from the bootstrap/ folder
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Check ALL Terraform code is formatted (fix locally with: terraform fmt -recursive)
      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # 5. Download providers and connect to this environment's state file in S3
      - name: Terraform init
        run: terraform init -input=false

      # 6. Check the code has no errors
      - name: Terraform validate
        run: terraform validate

      # 7. Show what will change, and save it to a file
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # 8. Apply exactly that saved plan to AWS
      - name: Terraform apply
        run: terraform apply -input=false tfplan
