# MAIN PIPELINE - this is the one that starts when you push.
#
# It runs two stages, one after the other:
#
#   Stage 1: terraform  -> create/update the AWS infrastructure  (terraform.yml)
#   Stage 2: deploy     -> build and deploy the React app        (deploy.yml)
#
# Stage 2 only starts after Stage 1 succeeds,
# so the app is never deployed to a server that doesn't exist yet.

name: CI/CD Pipeline

on:
  push:
    branches: ["**"] # "**" = every branch
    paths:
      - "terraform/**"
      - "react-app/**"
      - ".github/workflows/**"
  workflow_dispatch: # Lets you run it manually from the "Actions" tab

# Needed so GitHub can log in to AWS with OIDC (no access keys)
permissions:
  id-token: write
  contents: read

# Never run two pipelines at the same time (wait for the previous one)
concurrency:
  group: cicd-pipeline
  cancel-in-progress: false

jobs:
  # Stage 1
  terraform:
    uses: ./.github/workflows/terraform.yml

  # Stage 2 (waits for Stage 1)
  deploy:
    needs: terraform
    uses: ./.github/workflows/deploy.yml
